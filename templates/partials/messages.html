{% if messages %}
  <div class="mb-4 d-grid gap-2">
    {% for message in messages %}
      <div role="alert" class="alert alert-dismissible fade show mb-0
        {% if 'success' in message.tags %}alert-success
        {% elif 'error' in message.tags %}alert-danger
        {% elif 'warning' in message.tags %}alert-warning
        {% else %}alert-info{% endif %}">
        <i class="bi bi-info-circle me-2" aria-hidden="true"></i>{{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar mensaje"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
