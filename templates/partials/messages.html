{% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
      <div role="alert" class="flex items-start justify-between rounded-lg px-4 py-3 text-sm
        {% if 'success' in message.tags %}bg-green-100 text-green-800
        {% elif 'error' in message.tags %}bg-red-100 text-red-800
        {% elif 'warning' in message.tags %}bg-yellow-100 text-yellow-800
        {% else %}bg-sky-100 text-sky-800{% endif %}">
        <span>{{ message }}</span>
        <button type="button" class="ml-3 font-semibold" onclick="this.parentElement.remove()" aria-label="Cerrar mensaje">&#10005;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
