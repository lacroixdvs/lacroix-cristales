{% extends "base.html" %}

{% block title %}Usuarios — Vit Cristales{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
  <div>
    <h1 class="h2 fw-bold mb-1">Usuarios</h1>
    <p class="text-body-secondary small mb-0">Administración de cuentas y perfiles de acceso.</p>
  </div>
  <a href="{% url 'usuarios:usuario-create' %}" class="btn btn-vit">
    <i class="bi bi-person-plus me-1" aria-hidden="true"></i>Nuevo usuario
  </a>
</div>

<section class="card border-0 shadow-sm mt-4">
  <div class="card-body">
    <form method="get" class="mb-3">
      <label for="buscador-usuarios" class="visually-hidden">Buscar usuarios</label>
      <div class="input-group">
        <span class="input-group-text bg-white" aria-hidden="true"><i class="bi bi-search"></i></span>
        <input id="buscador-usuarios" type="search" name="q" value="{{ q }}"
               data-live-search="resultados-usuarios"
               placeholder="Buscar por usuario o email..."
               class="form-control">
      </div>
    </form>

    <div id="resultados-usuarios">
      {% include "usuarios/partials/usuario_resultados.html" %}
    </div>
  </div>
</section>
{% endblock %}
