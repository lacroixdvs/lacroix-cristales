{% extends "base.html" %}

{% block title %}Usuarios — Vit Cristales{% endblock %}

{% block content %}
<div class="flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Usuarios</h1>
    <p class="mt-1 text-sm text-gray-500">Administración de cuentas y perfiles de acceso.</p>
  </div>
  <a href="{% url 'usuarios:usuario-create' %}" class="rounded-lg bg-primary-600 px-4 py-2 text-sm text-white hover:bg-primary-700">Nuevo usuario</a>
</div>

<section class="mt-6 rounded-xl border border-gray-100 bg-white p-5 shadow-sm">
  <form method="get" class="mb-4">
    <label for="buscador-usuarios" class="sr-only">Buscar usuarios</label>
    <input id="buscador-usuarios" type="search" name="q" value="{{ q }}"
           data-live-search="resultados-usuarios"
           placeholder="Buscar por usuario o email..."
           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-primary-600 focus:ring-primary-600">
  </form>

  <div id="resultados-usuarios">
    {% include "usuarios/partials/usuario_resultados.html" %}
  </div>
</section>
{% endblock %}
