{% extends "base.html" %}

{% block title %}Ventas — Vit Cristales{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
  <div>
    <h1 class="h2 fw-bold mb-1">Ventas</h1>
    <p class="text-body-secondary small mb-0">Borradores, ventas confirmadas y control de stock.</p>
  </div>
  <a href="{% url 'ventas:venta-create' %}" class="btn btn-vit">
    <i class="bi bi-receipt me-1" aria-hidden="true"></i>Nueva venta
  </a>
</div>

<section class="card border-0 shadow-sm mt-4">
  <div class="card-body">
    <form method="get" class="row g-2 align-items-center mb-3">
      <div class="col-12 col-md">
        <label for="buscador-ventas" class="visually-hidden">Buscar ventas</label>
        <div class="input-group">
          <span class="input-group-text bg-white" aria-hidden="true"><i class="bi bi-search"></i></span>
          <input id="buscador-ventas" type="search" name="q" value="{{ q }}"
                 data-live-search="resultados-ventas"
                 placeholder="Buscar por cliente, CUIT o vendedor..."
                 class="form-control">
        </div>
      </div>
      <div class="col-12 col-md-3">
        <label for="filtro-estado" class="visually-hidden">Estado</label>
        <select id="filtro-estado" name="estado" class="form-select">
          <option value="">Todos los estados</option>
          {% for valor, etiqueta in estados %}
            <option value="{{ valor }}" {% if estado == valor %}selected{% endif %}>{{ etiqueta }}</option>
          {% endfor %}
        </select>
      </div>
      {% if es_adm %}
        <div class="col-12 col-md-3">
          <label for="filtro-activo" class="visually-hidden">Activo</label>
          <select id="filtro-activo" name="activo" class="form-select">
            <option value="1" {% if activo == "1" %}selected{% endif %}>Activas</option>
            <option value="0" {% if activo == "0" %}selected{% endif %}>Inactivas</option>
            <option value="todos" {% if activo == "todos" %}selected{% endif %}>Todas</option>
          </select>
        </div>
      {% endif %}
      <div class="col-12 col-md-auto">
        <button type="submit" class="btn btn-outline-secondary w-100">Filtrar</button>
      </div>
    </form>

    <div id="resultados-ventas">
      {% include "ventas/partials/venta_resultados.html" %}
    </div>
  </div>
</section>
{% endblock %}
