{% extends "base.html" %}

{% block title %}Proveedores — Vit Cristales{% endblock %}

{% block content %}
<div class="flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Proveedores</h1>
    <p class="mt-1 text-sm text-gray-500">Proveedores de vidrios, mamparas y accesorios.</p>
  </div>
  <a href="{% url 'proveedores:proveedor-create' %}" class="rounded-lg bg-primary-600 px-4 py-2 text-sm text-white hover:bg-primary-700">Nuevo proveedor</a>
</div>

<section class="mt-6 rounded-xl border border-gray-100 bg-white p-5 shadow-sm">
  <form method="get" class="mb-4 flex flex-col gap-3 sm:flex-row">
    <div class="flex-1">
      <label for="buscador-proveedores" class="sr-only">Buscar proveedores</label>
      <input id="buscador-proveedores" type="search" name="q" value="{{ q }}"
             data-live-search="resultados-proveedores"
             placeholder="Buscar por razón social, CUIT, email o rubro..."
             class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-primary-600 focus:ring-primary-600">
    </div>
    <div class="sm:w-48">
      <label for="filtro-estado" class="sr-only">Estado</label>
      <select id="filtro-estado" name="activo"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-primary-600 focus:ring-primary-600">
        <option value="1" {% if activo == "1" %}selected{% endif %}>Activos</option>
        <option value="0" {% if activo == "0" %}selected{% endif %}>Inactivos</option>
        <option value="todos" {% if activo == "todos" %}selected{% endif %}>Todos</option>
      </select>
    </div>
    <button type="submit" class="rounded-lg border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Filtrar</button>
  </form>

  <div id="resultados-proveedores">
    {% include "proveedores/partials/proveedor_resultados.html" %}
  </div>
</section>
{% endblock %}
