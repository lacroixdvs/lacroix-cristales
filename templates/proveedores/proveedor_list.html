{% extends "base.html" %}

{% block title %}Proveedores — Vit Cristales{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
  <div>
    <h1 class="h2 fw-bold mb-1">Proveedores</h1>
    <p class="text-body-secondary small mb-0">
      Proveedores de vidrios, mamparas y accesorios.
      <span class="badge rounded-pill text-bg-light border text-secondary ms-1">{{ page_obj.paginator.count }}</span>
    </p>
  </div>
  <a href="{% url 'proveedores:proveedor-create' %}" class="btn btn-vit">
    <i class="bi bi-truck me-1" aria-hidden="true"></i>Nuevo proveedor
  </a>
</div>

<section class="card border-0 shadow-sm mt-4">
  <div class="card-body">
    <form method="get" class="row g-2 align-items-center mb-3">
      <div class="col-12 col-md">
        <label for="buscador-proveedores" class="visually-hidden">Buscar proveedores</label>
        <div class="input-group">
          <span class="input-group-text bg-white" aria-hidden="true"><i class="bi bi-search"></i></span>
          <input id="buscador-proveedores" type="search" name="q" value="{{ q }}"
                 data-live-search="resultados-proveedores"
                 placeholder="Buscar por razón social, CUIT, email o rubro..."
                 class="form-control">
        </div>
      </div>
      <div class="col-12 col-md-3">
        <label for="filtro-estado" class="visually-hidden">Estado</label>
        <select id="filtro-estado" name="activo" class="form-select">
          <option value="1" {% if activo == "1" %}selected{% endif %}>Activos</option>
          <option value="0" {% if activo == "0" %}selected{% endif %}>Inactivos</option>
          <option value="todos" {% if activo == "todos" %}selected{% endif %}>Todos</option>
        </select>
      </div>
      <div class="col-12 col-md-auto">
        <button type="submit" class="btn btn-outline-secondary w-100">Filtrar</button>
      </div>
    </form>

    <div id="resultados-proveedores">
      {% include "proveedores/partials/proveedor_resultados.html" %}
    </div>
  </div>
</section>
{% endblock %}
